run_id: proposed-distilbert-sst2-imdb
method: "CFS-eSAFE (Cross-Fitted Fixed-Sequence e-value Safety)"
model:
  name: "distilbert-base-uncased-finetuned-sst-2-english"
  role: "sentiment_evaluator"
  task: "sentiment-classification"
dataset:
  name: "imdb"
  text_field: "text"
  label_field: "label"
  preprocessing:
    max_length: 256
    lowercase: false
  splits:
    opt_size: 120
    audit_total: 200
    audit_disc: 100
    audit_conf: 100
    eval_size: 300
training:
  learning_rate: 5.0e-5
  batch_size: 16
  epochs: 1
  optimizer: "adamw"
  warmup_steps: 0
  prompt_optimization:
    iterations: 3
    candidates_per_iter: 4
    alpha: 0.1
    tau_similarity: 0.75
    ppl_max: 80.0
    delta_noninferiority: 0.01
    J_top_slices: 5
    alpha_max_spend: 0.02
    reward_frac: 0.5
    slice_min_support: 12
    gatekeeping: "fixed_sequence"
    discovery_size: 100
    confirmation_size: 100
optuna:
  n_trials: 20
  search_spaces:
    - param_name: "tau_similarity"
      distribution_type: "uniform"
      low: 0.65
      high: 0.85
    - param_name: "pi_fluency_nll"
      distribution_type: "uniform"
      low: 1.5
      high: 4.0
    - param_name: "delta_noninferiority"
      distribution_type: "uniform"
      low: 0.0
      high: 0.03
    - param_name: "J_top_slices"
      distribution_type: "int"
      low: 3
      high: 10
    - param_name: "alpha_max_spend"
      distribution_type: "loguniform"
      low: 0.005
      high: 0.05
